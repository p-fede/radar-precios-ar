<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detector Argentina — Oportunidades y Precios Bug</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.8); }
    }
    .bug-glow {
      animation: pulseGlow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Navbar superior minimalista -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">⚡</span>
        <div>
          <span class="font-black text-xl tracking-tight text-white">DETECTOR<span class="text-indigo-400">.AR</span></span>
          <span class="text-[10px] uppercase font-bold tracking-widest bg-indigo-950 border border-indigo-700/50 text-indigo-300 px-2 py-0.5 rounded-full ml-2">PRO</span>
        </div>
      </div>
      <div id="statsBar" class="hidden md:flex items-center gap-6 text-xs text-slate-400">
        <div>Total: <b id="statTotal" class="text-white">0</b></div>
        <div>Bugs: <b id="statBugs" class="text-rose-400">0</b></div>
        <div>Máx Descuento: <b id="statMaxDisc" class="text-emerald-400">0%</b></div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Hero / Presentación -->
    <div class="text-center max-w-3xl mx-auto mb-8">
      <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-3">
        Radar de Liquidaciones en Vivo
      </h1>
      <p class="text-slate-400 text-sm md:text-base">
        Rastreá ofertas reales, chollos y errores de precio en las principales tiendas y supermercados de Argentina.
      </p>
    </div>

    <!-- Barra de Búsqueda y Filtros Rápidos -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 mb-6 shadow-xl">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
        <div class="md:col-span-2">
          <input id="qInput" type="text" placeholder="Buscar producto (ej: café, taladro, celular, fideos...)" 
                 class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-sm outline-none focus:border-indigo-500 font-medium">
        </div>
        <div>
          <select id="discountSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm outline-none focus:border-indigo-500 font-medium cursor-pointer">
            <option value="0" selected>⚡ Todos los Descuentos</option>
            <option value="30">Desde 30% OFF</option>
            <option value="50">Desde 50% OFF (Liquidaciones)</option>
            <option value="65">Solo Gangas y Bugs (65%+)</option>
          </select>
        </div>
        <div>
          <button id="searchBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-150 flex items-center justify-center gap-2 text-sm shadow cursor-pointer">
            <span>🔍</span> Explorar
          </button>
        </div>
      </div>

      <!-- Store Tabs (Pestañas de tiendas como en Detector) -->
      <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none text-xs" id="storeTabs">
        <button data-store="todas" class="tab-btn px-3 py-1.5 rounded-lg font-bold bg-indigo-600 text-white whitespace-nowrap">🔥 Todas las Tiendas</button>
        <button data-store="carrefour" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">🔵 Carrefour</button>
        <button data-store="dia" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">🔴 Día Online</button>
        <button data-store="easy" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">🟠 Easy</button>
        <button data-store="mercadolibre" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">🟡 MercadoLibre</button>
        <button data-store="cetrogar" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">🟣 Cetrogar</button>
        <button data-store="megatone" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">🔴 Megatone</button>
        <button data-store="bidcom" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">🟢 Bidcom</button>
        <button data-store="naldo" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">🔵 Naldo</button>
      </div>
    </div>

    <!-- Indicador de estado -->
    <div id="status" class="text-center text-slate-400 my-8 hidden"></div>

    <!-- Grilla de Productos estilo Detector -->
    <div id="results" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5"></div>
  </main>

  <script>
    let activeStore = "todas";
    const searchBtn = document.getElementById("searchBtn");
    const qInput = document.getElementById("qInput");
    const discountSelect = document.getElementById("discountSelect");
    const statusDiv = document.getElementById("status");
    const resultsDiv = document.getElementById("results");
    const storeTabs = document.getElementById("storeTabs");

    // Manejo de pestañas de tiendas
    storeTabs.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        storeTabs.querySelectorAll(".tab-btn").forEach(b => {
          b.className = "tab-btn px-3 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap";
        });
        btn.className = "tab-btn px-3 py-1.5 rounded-lg font-bold bg-indigo-600 text-white whitespace-nowrap";
        activeStore = btn.dataset.store;
        ejecutarBusqueda();
      });
    });

    async function ejecutarBusqueda() {
      const q = qInput.value.trim();
      const minDiscount = discountSelect.value;

      statusDiv.innerHTML = `
        <div class="inline-flex items-center gap-2.5 bg-slate-900 border border-slate-800 px-4 py-2.5 rounded-xl text-slate-200 text-sm">
          <svg class="animate-spin h-4 w-4 text-indigo-400" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
          Extrayendo catálogo y fotografías en alta definición...
        </div>
      `;
      statusDiv.classList.remove("hidden");
      resultsDiv.innerHTML = "";
      searchBtn.disabled = true;

      try {
        const res = await fetch(`/api/search?store=${activeStore}&q=${encodeURIComponent(q)}&minDiscount=${minDiscount}`);
        const data = await res.json();

        if (!data || data.length === 0) {
          statusDiv.innerHTML = `
            <div class="bg-slate-900 border border-slate-800 text-slate-300 px-5 py-3 rounded-xl inline-block text-sm">
              No se detectaron productos bajo este criterio. Prueba con una palabra más amplia o cambiando de tienda.
            </div>
          `;
          return;
        }

        statusDiv.classList.add("hidden");

        // Actualizar estadísticas del Header
        const bugCount = data.filter(d => d.isBug).length;
        const maxDisc = Math.max(...data.map(d => d.descuento || 0));
        document.getElementById("statTotal").textContent = data.length;
        document.getElementById("statBugs").textContent = bugCount;
        document.getElementById("statMaxDisc").textContent = `-${maxDisc}%`;

        // Renderizado de tarjetas con fotografías y badges
        resultsDiv.innerHTML = data.map(item => `
          <div class="bg-slate-900 border ${item.isBug ? 'border-rose-500 bug-glow' : 'border-slate-800'} rounded-2xl overflow-hidden flex flex-col justify-between hover:border-slate-600 transition group shadow-md">
            
            <!-- Contenedor de Imagen -->
            <div class="relative bg-white p-4 h-48 md:h-56 flex items-center justify-center overflow-hidden">
              <img src="${item.img}" alt="${item.nombre}" loading="lazy" class="max-h-full max-w-full object-contain group-hover:scale-105 transition duration-300">
              
              <!-- Badge de Tienda -->
              <span class="absolute top-2.5 left-2.5 bg-slate-900/90 backdrop-blur text-slate-200 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded shadow">
                ${item.tienda}
              </span>

              <!-- Badge de Descuento -->
              ${item.descuento > 0 ? `
                <span class="absolute top-2.5 right-2.5 ${item.isBug ? 'bg-rose-600' : 'bg-emerald-600'} text-white text-xs font-black px-2 py-0.5 rounded-md shadow">
                  -${item.descuento}%
                </span>
              ` : ''}
            </div>

            <!-- Información del Producto -->
            <div class="p-4 flex flex-col justify-between flex-1">
              <div>
                ${item.isBug ? `
                  <div class="mb-2">
                    <span class="text-[10px] font-black uppercase tracking-wider bg-rose-950 text-rose-300 border border-rose-800 px-2 py-0.5 rounded inline-block animate-pulse">
                      🚨 PRECIO BUG / GANGA
                    </span>
                  </div>
                ` : ''}

                <a href="${item.url}" target="_blank" class="font-semibold text-xs md:text-sm text-slate-200 group-hover:text-indigo-400 transition line-clamp-2 mb-3" title="${item.nombre}">
                  ${item.nombre}
                </a>
              </div>

              <!-- Precios y Botón -->
              <div class="pt-3 border-t border-slate-800/80">
                <div class="flex items-baseline gap-2 mb-1">
                  <span class="text-lg md:text-xl font-black text-emerald-400">
                    $ ${item.precio.toLocaleString("es-AR")}
                  </span>
                  ${item.precioLista ? `
                    <span class="text-xs text-slate-500 line-through">
                      $ ${item.precioLista.toLocaleString("es-AR")}
                    </span>
                  ` : ''}
                </div>

                ${item.ahorro > 0 ? `
                  <div class="text-[11px] text-slate-400 mb-3">
                    Ahorrás: <b class="text-emerald-400">$ ${item.ahorro.toLocaleString("es-AR")}</b>
                  </div>
                ` : '<div class="h-4 mb-3"></div>'}

                <a href="${item.url}" target="_blank" class="block w-full text-center bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 text-slate-200 hover:text-white py-2 rounded-xl text-xs font-bold transition">
                  Ver en Tienda ↗
                </a>
              </div>
            </div>
          </div>
        `).join("");

      } catch (err) {
        statusDiv.innerHTML = `
          <div class="bg-rose-950/80 border border-rose-500/40 text-rose-300 px-4 py-2.5 rounded-xl inline-block text-sm">
            Error al consultar los catálogos. Intenta nuevamente.
          </div>
        `;
        statusDiv.classList.remove("hidden");
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener("click", ejecutarBusqueda);
    qInput.addEventListener("keypress", (e) => { if (e.key === "Enter") ejecutarBusqueda(); });

    // Carga inicial automática
    ejecutarBusqueda();
  </script>
</body>
</html>
