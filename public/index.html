<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADAR.AR — Ofertas reales y precios bug en tiendas argentinas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.85); }
    }
    .bug-card { animation: pulseGlow 2s infinite ease-in-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media (prefers-reduced-motion: reduce) { .bug-card, .animate-pulse { animation: none; } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">⚡</span>
        <div>
          <span class="font-black text-xl tracking-tight text-white">RADAR<span class="text-indigo-400">.AR</span></span>
          <span id="badgeStores" class="text-[10px] uppercase font-bold tracking-widest bg-slate-800 border border-slate-700 text-slate-300 px-2 py-0.5 rounded-full ml-2">verificando tiendas…</span>
        </div>
      </div>
      <div class="hidden md:flex items-center gap-6 text-xs text-slate-400 font-medium">
        <div>Tiendas activas: <b id="statStores" class="text-white">–</b></div>
        <div>Detectados: <b id="statTotal" class="text-white">0</b></div>
        <div>Bugs: <b id="statBugs" class="text-rose-400">0</b></div>
        <div>Máx. descuento: <b id="statMax" class="text-emerald-400">0%</b></div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="text-center max-w-3xl mx-auto mb-8">
      <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight mb-3">Radar de Ofertas y Precios Bug</h1>
      <p class="text-slate-400 text-sm md:text-base">Liquidaciones extremas, errores de carga y promociones reales en tiendas de Argentina.</p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 mb-6 shadow-xl">
      <div class="grid grid-cols-1 md:grid-cols-6 gap-3 mb-4">
        <div class="md:col-span-3">
          <input id="qInput" type="search" maxlength="80" placeholder="¿Qué buscás? (zapatillas, taladro, celular, café, smart tv…)"
                 class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-sm outline-none focus:border-indigo-500 font-medium">
        </div>
        <div>
          <select id="storeSelect" disabled class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white text-sm outline-none focus:border-indigo-500 font-medium cursor-pointer disabled:opacity-50">
            <option value="todas">Cargando tiendas…</option>
          </select>
        </div>
        <div>
          <select id="discSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white text-sm outline-none focus:border-indigo-500 font-medium cursor-pointer">
            <option value="0">Cualquier descuento</option>
            <option value="20">−20% o más</option>
            <option value="35">−35% o más</option>
            <option value="50">−50% o más</option>
            <option value="65">−65% o más</option>
          </select>
        </div>
        <div>
          <button id="searchBtn" disabled class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 disabled:opacity-50 disabled:cursor-wait text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow cursor-pointer">
            <span>⚡</span> Rastrear
          </button>
        </div>
      </div>

      <div id="rubroTabs" class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs border-t border-slate-800/80 pt-3"></div>
    </div>

    <div id="status" class="text-center text-slate-400 my-8"></div>
    <div id="results" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5"></div>
    <div id="footerInfo" class="text-center text-xs text-slate-500 mt-8"></div>
  </main>

  <script>
    const RUBROS = {
      todos: "🔥 Todos", supermercados: "🛒 Supermercados", tecnologia: "💻 Tecno & Celulares",
      herramientas: "🔧 Herramientas", electro: "🔌 Electro & Clima", hogar: "🛋️ Hogar & Muebles",
      deportes: "👟 Deportes & Zapas", moda: "👕 Moda", farmacia: "💄 Farmacia & Belleza",
      libreria: "📚 Librería", juguetes: "🧸 Juguetes", infantil: "👶 Ropa infantil"
    };

    const $ = id => document.getElementById(id);
    const searchBtn = $("searchBtn"), qInput = $("qInput"), storeSelect = $("storeSelect"),
          discSelect = $("discSelect"), statusDiv = $("status"), resultsDiv = $("results"),
          rubroTabs = $("rubroTabs"), footerInfo = $("footerInfo");

    let activeRubro = "todos";
    let activeStores = [];   // tiendas que pasaron el chequeo de salud
    let caidas = [];
    let reqSeq = 0;
    let extStores = [];      // tiendas que bloquean servidores (las consulta la extensión de Chrome)

    // ---------- Puente con la extensión de Chrome ----------
    // La extensión (content script en este sitio) responde mensajes {source:"radar-web"} con {source:"radar-ext"}.
    let extDisponible = false;
    const extPendientes = new Map();
    window.addEventListener("message", (ev) => {
      if (ev.source !== window || ev.data?.source !== "radar-ext") return;
      if (ev.data.type === "pong") { extDisponible = true; return; }
      if (ev.data.type === "results" && extPendientes.has(ev.data.reqId)) {
        extPendientes.get(ev.data.reqId)(Array.isArray(ev.data.items) ? ev.data.items : []);
        extPendientes.delete(ev.data.reqId);
      }
    });
    window.postMessage({ source: "radar-web", type: "ping" }, location.origin);

    function buscarConExtension(stores, q, timeoutMs = 15000) {
      if (!extDisponible || !stores.length) return Promise.resolve([]);
      const reqId = Math.random().toString(36).slice(2);
      return new Promise(resolve => {
        extPendientes.set(reqId, resolve);
        window.postMessage({ source: "radar-web", type: "search", reqId, q, stores }, location.origin);
        setTimeout(() => { if (extPendientes.has(reqId)) { extPendientes.delete(reqId); resolve([]); } }, timeoutMs);
      });
    }
    // Normaliza lo que manda la extensión (no confiamos en su forma)
    const limpiarItemExt = (x) => (x && x.nombre && Number(x.precio) > 0) ? {
      tienda: String(x.tienda || ""), tiendaId: String(x.tiendaId || ""), nombre: String(x.nombre),
      precio: Number(x.precio), precioLista: Number(x.precioLista) > Number(x.precio) ? Number(x.precioLista) : null,
      descuento: Number(x.descuento) || 0, ahorro: Number(x.ahorro) || 0, isBug: Boolean(x.isBug),
      img: String(x.img || ""), url: String(x.url || ""), ean: x.ean ? String(x.ean) : null, viaExtension: true
    } : null;

    // ---------- helpers seguros ----------
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const safeUrl = u => { try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : "#"; } catch { return "#"; } };
    const money = n => "$ " + Number(n).toLocaleString("es-AR", { maximumFractionDigits: 0 });

    function showStatus(html) { statusDiv.innerHTML = html; statusDiv.classList.remove("hidden"); }
    function spinner(text) {
      return `<div class="inline-flex items-center gap-2.5 bg-slate-900 border border-slate-800 px-4 py-2.5 rounded-xl text-slate-200 text-sm shadow">
        <svg class="animate-spin h-4 w-4 text-indigo-400" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
        ${esc(text)}</div>`;
    }
    function box(text, tone = "slate") {
      const tones = { slate: "bg-slate-900 border-slate-800 text-slate-300", rose: "bg-rose-950/80 border-rose-500/40 text-rose-300" };
      return `<div class="${tones[tone]} border px-5 py-3 rounded-xl inline-block text-sm">${esc(text)}</div>`;
    }

    // ---------- 1) Chequeo de salud: solo mostramos tiendas que responden ----------
    async function cargarTiendas() {
      showStatus(spinner("Verificando qué tiendas están respondiendo…"));
      try {
        const r = await fetch("/api/search?mode=health");
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        activeStores = j.stores.filter(s => s.ok);
        caidas = j.stores.filter(s => !s.ok);
        extStores = j.extension || [];
      } catch (e) {
        showStatus(box("No se pudo verificar el estado de las tiendas. Recargá la página en unos segundos.", "rose"));
        return false;
      }
      if (!activeStores.length) {
        showStatus(box("Ninguna tienda está respondiendo en este momento. Probá más tarde.", "rose"));
        return false;
      }

      $("statStores").textContent = activeStores.length;
      $("badgeStores").textContent = `${activeStores.length} tiendas activas`;
      $("badgeStores").className = "text-[10px] uppercase font-bold tracking-widest bg-emerald-950 border border-emerald-700/60 text-emerald-300 px-2 py-0.5 rounded-full ml-2";

      construirTabs();
      construirSelector();
      storeSelect.disabled = false;
      searchBtn.disabled = false;
      return true;
    }

    function construirTabs() {
      const presentes = new Set(activeStores.map(s => s.rubro));
      rubroTabs.innerHTML = Object.entries(RUBROS)
        .filter(([k]) => k === "todos" || presentes.has(k))
        .map(([k, label]) => `<button data-rubro="${k}" class="rubro-btn px-3 py-1.5 rounded-lg whitespace-nowrap">${esc(label)}</button>`)
        .join("");
      rubroTabs.querySelectorAll(".rubro-btn").forEach(btn => btn.addEventListener("click", () => {
        activeRubro = btn.dataset.rubro;
        pintarTabs();
        construirSelector();
        ejecutar();
      }));
      pintarTabs();
    }

    function pintarTabs() {
      rubroTabs.querySelectorAll(".rubro-btn").forEach(b => {
        const on = b.dataset.rubro === activeRubro;
        b.className = "rubro-btn px-3 py-1.5 rounded-lg whitespace-nowrap " +
          (on ? "font-bold bg-indigo-600 text-white" : "font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700");
      });
    }

    function construirSelector() {
      const lista = activeRubro === "todos" ? activeStores : activeStores.filter(s => s.rubro === activeRubro);
      const grupos = {};
      lista.forEach(s => (grupos[s.rubro] ||= []).push(s));
      let html = `<option value="todas">🌐 Todas (${lista.length})</option>`;
      for (const [rubro, tiendas] of Object.entries(grupos)) {
        html += `<optgroup label="${esc((RUBROS[rubro] || rubro).replace(/^\S+\s/, ""))}">` +
          tiendas.sort((a, b) => a.name.localeCompare(b.name, "es")).map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("") +
          `</optgroup>`;
      }
      storeSelect.innerHTML = html;
    }

    // ---------- 2) Búsqueda ----------
    async function ejecutar() {
      if (!activeStores.length) return;
      const seq = ++reqSeq;
      const q = qInput.value.trim();
      const elegida = storeSelect.value;
      const ids = elegida !== "todas"
        ? [elegida]
        : (activeRubro === "todos" ? activeStores : activeStores.filter(s => s.rubro === activeRubro)).map(s => s.id);

      showStatus(spinner(`Escaneando ${ids.length} tienda${ids.length > 1 ? "s" : ""}…`));
      resultsDiv.innerHTML = "";
      footerInfo.textContent = "";
      searchBtn.disabled = true;

      try {
        const params = new URLSearchParams({ ids: ids.join(","), q, minDiscount: discSelect.value });
        const extObjetivo = elegida !== "todas" ? [] : (activeRubro === "todos" ? extStores : extStores.filter(s => s.rubro === activeRubro));
        const [res, extItems] = await Promise.all([
          fetch(`/api/search?${params}`),
          buscarConExtension(extObjetivo, q)
        ]);
        const json = await res.json().catch(() => ({}));
        if (seq !== reqSeq) return; // llegó una respuesta vieja: la ignoramos
        if (!res.ok) throw new Error(json.error || "HTTP " + res.status);

        const minD = Number(discSelect.value) || 0;
        const deExt = extItems.map(limpiarItemExt).filter(x => x && (x.descuento >= minD || x.isBug));
        const data = [...(json.results || []), ...deExt].sort((a, b) => (b.isBug - a.isBug) || (b.descuento - a.descuento));
        const fallidas = json.fallidas || [];
        footerInfo.textContent = `Respondieron ${json.respondieron} de ${json.consultadas} tiendas consultadas` +
          (fallidas.length ? ` · sin respuesta ahora: ${fallidas.map(f => f.name).join(", ")}` : "") +
          (extObjetivo.length ? (extDisponible
            ? ` · ${deExt.length} resultados vía tu extensión (${extObjetivo.map(s => s.name).join(", ")})`
            : ` · ${extObjetivo.length} tiendas (${extObjetivo.map(s => s.name).join(", ")}) solo se ven con la extensión de RadarBug abierta`) : "");

        if (!data.length) {
          showStatus(box(q
            ? `No encontramos ofertas para "${q}" con ese filtro. Probá otra palabra, otra tienda o bajá el descuento mínimo.`
            : "No hay ofertas con ese filtro en este momento. Probá bajar el descuento mínimo."));
          actualizarStats([]);
          return;
        }

        statusDiv.classList.add("hidden");
        actualizarStats(data);
        resultsDiv.innerHTML = data.map(tarjeta).join("");
      } catch (err) {
        if (seq !== reqSeq) return;
        showStatus(box("Error al consultar las tiendas. Intentá nuevamente en unos segundos.", "rose"));
      } finally {
        if (seq === reqSeq) searchBtn.disabled = false;
      }
    }

    function actualizarStats(data) {
      $("statTotal").textContent = data.length;
      $("statBugs").textContent = data.filter(d => d.isBug).length;
      $("statMax").textContent = data.length ? `-${Math.max(...data.map(d => d.descuento || 0))}%` : "0%";
    }

    function tarjeta(item) {
      const url = esc(safeUrl(item.url));
      const nombre = esc(item.nombre);
      return `
      <div class="bg-slate-900 border ${item.isBug ? "border-rose-500 bug-card" : "border-slate-800"} rounded-2xl overflow-hidden flex flex-col justify-between hover:border-slate-600 transition group shadow-lg">
        <div class="relative bg-white p-4 h-48 md:h-56 flex items-center justify-center overflow-hidden">
          <img src="${esc(safeUrl(item.img))}" alt="${nombre}" loading="lazy" referrerpolicy="no-referrer"
               onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300&q=80'"
               class="max-h-full max-w-full object-contain group-hover:scale-105 transition duration-300">
          <span class="absolute top-2.5 left-2.5 bg-slate-900/90 text-slate-200 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded shadow">${esc(item.tienda)}</span>
          ${item.descuento > 0 ? `<span class="absolute top-2.5 right-2.5 ${item.isBug ? "bg-rose-600" : "bg-emerald-600"} text-white text-xs font-black px-2 py-0.5 rounded-md shadow">-${Number(item.descuento)}%</span>` : ""}
        </div>
        <div class="p-4 flex flex-col justify-between flex-1">
          <div>
            ${item.isBug ? `<div class="mb-2"><span class="text-[10px] font-black uppercase tracking-wider bg-rose-950 text-rose-300 border border-rose-800 px-2 py-0.5 rounded inline-block animate-pulse">🚨 Precio bug / ganga</span></div>` : ""}
            ${veredictoHTML(item)}
            ${item.promo ? `<div class="mb-2"><span class="text-[10px] font-bold bg-amber-950 text-amber-300 border border-amber-800 px-2 py-0.5 rounded">🎁 ${esc(item.promo)} (promo por cantidad)</span></div>` : ""}
            <a href="${url}" target="_blank" rel="noopener noreferrer" class="font-semibold text-xs md:text-sm text-slate-200 group-hover:text-indigo-400 transition line-clamp-2 mb-3" title="${nombre}">${nombre}</a>
          </div>
          <div class="pt-3 border-t border-slate-800/80">
            <div class="flex items-baseline gap-2 mb-1 flex-wrap">
              <span class="text-lg md:text-xl font-black text-emerald-400">${money(item.precio)}</span>
              ${item.precioLista ? `<span class="text-xs text-slate-500 line-through">${money(item.precioLista)}</span>` : ""}
            </div>
            ${item.ahorro > 0 ? `<div class="text-[11px] text-slate-400 mb-2">Ahorrás: <b class="text-emerald-400">${money(item.ahorro)}</b></div>` : `<div class="h-4 mb-2"></div>`}
            ${comparacionHTML(item)}
            ${item.ean ? `<button data-ean="${esc(item.ean)}" class="cmp-btn w-full text-[11px] text-indigo-300 hover:text-indigo-200 font-semibold mb-2 text-left">🔎 Comparar en otras tiendas</button><div class="cmp-out text-[11px] mb-2"></div>` : ""}
            <a href="${url}" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 text-slate-200 hover:text-white py-2 rounded-xl text-xs font-bold transition">Ver oferta ↗</a>
          </div>
        </div>
      </div>`;
    }

    function veredictoHTML(item) {
      const v = item.veredicto;
      if (!v || v.tipo === "nuevo") return "";
      const estilos = {
        real: ["✅ Oferta real", "bg-emerald-950 text-emerald-300 border-emerald-800"],
        inflado: ["⚠️ Descuento inflado", "bg-amber-950 text-amber-300 border-amber-800"],
        normal: ["📊 Precio habitual", "bg-slate-800 text-slate-300 border-slate-700"]
      };
      const [label, cls] = estilos[v.tipo] || estilos.normal;
      return `<div class="mb-2" title="${esc(v.texto)}"><span class="text-[10px] font-bold border px-2 py-0.5 rounded ${cls}">${label}</span><div class="text-[10px] text-slate-500 mt-1">${esc(v.texto)}</div></div>`;
    }

    function comparacionHTML(item) {
      const c = item.comparacion;
      if (!c) return "";
      if (c.tipo === "masBarato") {
        return `<a href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener noreferrer" class="block text-[11px] bg-sky-950 border border-sky-800 text-sky-300 rounded-lg px-2 py-1 mb-2 hover:bg-sky-900">💡 ${money(c.diferencia)} más barato en <b>${esc(c.tienda)}</b> (${money(c.precio)})</a>`;
      }
      return `<div class="text-[11px] text-emerald-400 mb-2">🏆 Mejor precio entre ${Number(c.tiendasComparadas) + 1} tiendas</div>`;
    }

    // Comparar un producto por código de barras en todas las tiendas
    resultsDiv.addEventListener("click", async (e) => {
      const btn = e.target.closest(".cmp-btn");
      if (!btn) return;
      const out = btn.nextElementSibling;
      btn.disabled = true;
      out.innerHTML = `<span class="text-slate-400">Buscando en otras tiendas…</span>`;
      try {
        const r = await fetch(`/api/compare?ean=${encodeURIComponent(btn.dataset.ean)}`);
        const j = await r.json();
        const ofs = j.ofertas || [];
        out.innerHTML = ofs.length <= 1
          ? `<span class="text-slate-400">No lo encontramos en otras tiendas.</span>`
          : `<ul class="space-y-0.5">${ofs.slice(0, 6).map((o, i) => `<li><a class="${i === 0 ? "text-emerald-400 font-bold" : "text-slate-300"} hover:underline" href="${esc(safeUrl(o.url))}" target="_blank" rel="noopener noreferrer">${money(o.precio)} · ${esc(o.tienda)}</a></li>`).join("")}</ul>`;
      } catch {
        out.innerHTML = `<span class="text-rose-300">No se pudo comparar ahora.</span>`;
      } finally {
        btn.disabled = false;
      }
    });

    // ---------- eventos ----------
    searchBtn.addEventListener("click", ejecutar);
    storeSelect.addEventListener("change", ejecutar);
    discSelect.addEventListener("change", ejecutar);
    qInput.addEventListener("keydown", e => { if (e.key === "Enter") ejecutar(); });

    cargarTiendas().then(ok => ok && ejecutar());
  </script>
</body>
</html>
