<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Precios Argentina</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl md:text-5xl font-black text-rose-500 mb-2">⚡ Radar de Precios</h1>
      <p class="text-neutral-400 text-sm md:text-base">Compará precios en tiempo real entre tiendas argentinas</p>
    </header>

    <!-- Buscador -->
    <div class="flex gap-2 max-w-xl mx-auto mb-8">
      <input id="queryInput" type="text" placeholder="Ej: Oreo, Taladro Bosch, Mermelada BC..." 
             class="flex-1 bg-neutral-900 border border-neutral-700 rounded-xl px-4 py-3 text-white outline-none focus:border-rose-500">
      <button id="searchBtn" class="bg-rose-600 hover:bg-rose-500 px-6 py-3 rounded-xl font-bold transition">
        Buscar
      </button>
    </div>

    <!-- Mensajes de estado -->
    <div id="status" class="text-center text-neutral-400 my-4 hidden"></div>

    <!-- Resultados -->
    <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>

  <script>
    const searchBtn = document.getElementById("searchBtn");
    const queryInput = document.getElementById("queryInput");
    const statusDiv = document.getElementById("status");
    const resultsDiv = document.getElementById("results");

    async function buscar() {
      const q = queryInput.value.trim();
      if (!q) return;

      statusDiv.textContent = "Consultando tiendas en paralelo...";
      statusDiv.classList.remove("hidden");
      resultsDiv.innerHTML = "";
      searchBtn.disabled = true;

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();

        if (!data || data.length === 0) {
          statusDiv.textContent = "No se encontraron productos con ese término.";
          return;
        }

        statusDiv.textContent = `Se encontraron ${data.length} opciones (ordenadas de menor a mayor precio):`;

        resultsDiv.innerHTML = data.map((item, idx) => {
          const isCheapest = idx === 0;
          const cotoUrl = `https://www.cotodigital3.com.ar/sitios/cdigi/browse?Ntt=${encodeURIComponent(item.nombre).replace(/%20/g, "+")}`;
          const mlUrl = `https://listado.mercadolibre.com.ar/${encodeURIComponent(item.nombre)}`;

          return `
            <div class="bg-neutral-900 border ${isCheapest ? 'border-emerald-500/80 shadow-lg shadow-emerald-950/40' : 'border-neutral-800'} rounded-xl p-4 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center mb-2">
                  <span class="text-xs font-bold uppercase tracking-wider px-2 py-1 rounded bg-neutral-800 text-neutral-300">
                    ${item.tienda}
                  </span>
                  ${isCheapest ? '<span class="text-xs font-black bg-emerald-500 text-black px-2 py-0.5 rounded">MÁS BARATO</span>' : ''}
                </div>
                <a href="${item.url}" target="_blank" class="font-semibold text-sm line-clamp-2 hover:text-rose-400 transition mb-3">
                  ${item.nombre}
                </a>
              </div>

              <div class="mt-4 pt-3 border-t border-neutral-800">
                <div class="flex items-baseline gap-2 mb-3">
                  <span class="text-2xl font-black text-emerald-400">$ ${item.precio.toLocaleString("es-AR")}</span>
                  ${item.precioLista ? `<span class="text-xs text-neutral-500 line-through">$ ${item.precioLista.toLocaleString("es-AR")}</span>` : ''}
                  ${item.descuento > 0 ? `<span class="text-xs font-bold text-rose-400">-${item.descuento}%</span>` : ''}
                </div>

                <div class="flex gap-2 text-xs">
                  <a href="${cotoUrl}" target="_blank" class="flex-1 text-center bg-neutral-800 hover:bg-neutral-700 py-1.5 rounded font-medium text-neutral-300">
                    Ver en Coto
                  </a>
                  <a href="${mlUrl}" target="_blank" class="flex-1 text-center bg-neutral-800 hover:bg-neutral-700 py-1.5 rounded font-medium text-neutral-300">
                    Ver en ML
                  </a>
                </div>
              </div>
            </div>
          `;
        }).join("");
      } catch (err) {
        statusDiv.textContent = "Error al consultar las tiendas. Intenta nuevamente.";
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener("click", buscar);
    queryInput.addEventListener("keypress", (e) => { if (e.key === "Enter") buscar(); });
  </script>
</body>
</html>
